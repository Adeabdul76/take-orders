# Builds the Android app (APK) on GitHub's computers every time the code
# changes, and publishes it on the Releases page so it can be downloaded
# straight onto the cafe phone. No Flutter install needed on your own computer.
name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch: # lets you press "Run workflow" by hand in the Actions tab

permissions:
  contents: write # needed to publish the APK on the Releases page

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.9'
          cache: true

      - name: Get packages
        run: flutter pub get

      - name: Run receipt tests
        run: flutter test

      # The app must always be signed with the SAME key, or phones refuse to
      # install new versions as updates. The key lives in the SIGNING_KEY
      # secret (Settings > Secrets and variables > Actions), as
      # "password|base64-of-keystore".
      - name: Set up signing key
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        run: |
          if [ -z "$SIGNING_KEY" ]; then
            echo "::error::SIGNING_KEY secret is missing. Phones would refuse this build as an update."
            exit 1
          fi
          PASS="${SIGNING_KEY%%|*}"
          echo "${SIGNING_KEY#*|}" | base64 -d > android/app/release-key.jks
          printf 'storeFile=release-key.jks\nstorePassword=%s\nkeyAlias=takeorders\nkeyPassword=%s\n' "$PASS" "$PASS" > android/key.properties

      - name: Build APK
        run: flutter build apk --release --build-number=${{ github.run_number }}

      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-release.apk TakeOrders.apk

      - name: Publish on Releases page
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Take Orders - build ${{ github.run_number }}
          body: |
            Download **TakeOrders.apk** below on the cafe Android phone, open it, and tap Install.
            (If Android warns about unknown apps, allow installing from your browser / Files app.)
          files: TakeOrders.apk
          make_latest: true
